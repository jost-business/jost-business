name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # nx affected compares against an older commit, so it needs the history
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # Angular packages pin each other exactly, see the Nx/Angular version note
      - run: npm ci --legacy-peer-deps

      # Sets NX_BASE (last green commit on main, or the PR base) and NX_HEAD
      - uses: nrwl/nx-set-shas@v5

      # Only the projects a change can reach, and only the tasks whose inputs changed
      - run: npx nx affected -t lint typecheck test build --outputStyle=static
