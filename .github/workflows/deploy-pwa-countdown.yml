name: Deploy pwa-countdown to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/pwa-countdown/**'
      - 'libs/ui/countdown/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pwa-countdown
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set build version
        run: echo "export const APP_VERSION = '${{ github.run_number }}';" > apps/pwa-countdown/src/app/version.ts

      - name: Build
        run: npx nx build pwa-countdown --configuration production --base-href /

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/pwa-countdown/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
