<div class="finance-container">
  <h2 class="finance-title">Finance Dashboard</h2>
  <mat-card class="finance-card">
    <mat-card-header class="card-header">
      <mat-card-title class="card-title">Account Overview</mat-card-title>
    </mat-card-header>
    <mat-card-content class="card-content">
      <p class="user-greeting" *ngIf="authService.isAuthenticated()">
        Welcome, {{ authService.currentUser()?.name }}!
      </p>
      <p class="login-prompt" *ngIf="!authService.isAuthenticated()">
        Please log in to view your finances.
      </p>

      <table mat-table [dataSource]="transactions" class="transactions-table">
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef class="table-header">Date</th>
          <td mat-cell *matCellDef="let element" class="table-cell">{{ element.date }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="table-header">Description</th>
          <td mat-cell *matCellDef="let element" class="table-cell">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef class="table-header">Amount</th>
          <td mat-cell *matCellDef="let element" class="table-cell amount">{{ element.amount | currency }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header-row"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="data-row"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
