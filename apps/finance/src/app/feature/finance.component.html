<div class="finance-container">
  <h2 class="finance-title">Finance Dashboard</h2>
  <div class="finance-card">
    <div class="card-header">
      <h3 class="card-title">Account Overview</h3>
    </div>
    <div class="card-content">
      <p class="user-greeting" *ngIf="authService.isAuthenticated()">
        Welcome, {{ authService.currentUser()?.name }}!
      </p>
      <p class="login-prompt" *ngIf="!authService.isAuthenticated()">
        Please log in to view your finances.
      </p>

      <table class="transactions-table">
        <thead>
          <tr class="header-row">
            <th class="table-header">Date</th>
            <th class="table-header">Description</th>
            <th class="table-header">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr class="data-row" *ngFor="let element of transactions">
            <td class="table-cell">{{ element.date }}</td>
            <td class="table-cell">{{ element.description }}</td>
            <td class="table-cell amount">{{ element.amount | currency }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
