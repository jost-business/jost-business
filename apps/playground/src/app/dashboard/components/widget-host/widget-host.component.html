@if (customElements.get(tag())) {
  <!-- real web component is mounted in ngOnInit -->
} @else {
  <div class="placeholder">
    @if (image()) {
      <div class="preview">
        <img class="preview-img" [ngSrc]="image()" fill sizes="(max-width: 600px) 100vw, 33vw" [alt]="label()" />
      </div>
    }
    <!-- <code class="tag">{{ tag() }}</code>   -->
  </div>
}
