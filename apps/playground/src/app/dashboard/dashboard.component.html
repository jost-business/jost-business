<div class="dashboard-layout">

  <!-- Sidebar toggle button -->
  <button
    class="sidebar-toggle"
    [class.collapsed]="!sidebarOpen()"
    (click)="toggleSidebar()"
    [title]="sidebarOpen() ? 'Sidebar schliessen' : 'Widget-Auswahl öffnen'"
  >
    {{ sidebarOpen() ? '◀' : '▶' }}
  </button>

  <!-- Widget picker sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <app-widget-picker />
  </aside>

  <!-- Main grid area -->
  <main class="grid-area">
    <div class="grid-header">
      <h1 class="dashboard-title">Mein Portal</h1>
      <p class="dashboard-sub">Halte die Widget-Kopfzeile gedrückt und verschiebe Kacheln frei.</p>
    </div>
    <app-dashboard-grid />
  </main>

</div>
