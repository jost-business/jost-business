<main class="countdown-page">
  <header>
    <p class="eyebrow">✈️ Next Adventure</p>
    @if (trip) {
      <h1>{{ destinationCity }}<span class="dest-sub">
        @if (destinationCountry) {
          , {{ destinationCountry }}
        }
      </span></h1>
      <p class="subtitle">{{ trip.from | date: 'MMMM d, y' }}</p>
    }
  </header>

  <lib-romantic-countdown [targetDate]="target" [showSeconds]="true" [version]="version">
    <div arrived class="celebration">
      <div class="heart">❤️</div>
      <h1>Today is the Day!</h1>
      @if (trip) {
        <p>{{ trip.destination }} is waiting for you both.</p>
      }
      <div class="photo-frame">
        <img src="assets/images/us.jpeg" alt="Us" />
      </div>
      <p class="enjoy">✈️ Bon voyage. Enjoy every single moment.</p>
    </div>
  </lib-romantic-countdown>
</main>
