@if (together && trip) {
  <main class="together-page">
    <lib-together-card [trip]="trip" [version]="version" />
  </main>
} @else {
  <main class="countdown-page">
    <header>
      <p class="eyebrow">✈️ Next Adventure</p>
      @if (trip) {
        <h1>{{ destinationCity }}<span class="dest-sub">
          @if (destinationCountry) {
            , {{ destinationCountry }}
          }
        </span></h1>
        <p class="subtitle">{{ trip.from | date: 'MMMM d, y' }}</p>
      }
    </header>

    <lib-romantic-countdown [targetDate]="target" [showSeconds]="true" [version]="version" (arrived)="onCountdownArrived()">
      <!-- Fallback when the countdown reaches zero but no trip is in progress (e.g. the hardcoded fallback date) -->
      <div arrived class="celebration">
        <div class="heart">❤️</div>
        <h2>Today is the Day!</h2>
        @if (trip) {
          <p class="sub">{{ trip.destination }} is waiting for you both.</p>
        }
      </div>
    </lib-romantic-countdown>
  </main>
}
