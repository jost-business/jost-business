<header class="app-toolbar">
  <h1 class="app-title">Travel</h1>
  <span class="spacer"></span>
</header>

<div class="content">
  <router-outlet></router-outlet>

  <!-- Next Adventure -->
  <section class="adventure-section">
    <h2>Next Adventure</h2>
    <div class="adventure-content">
      <p>
        Sometimes the best adventures are the ones shared with someone special. I'm counting down the days to reunite with my beloved girlfriend in the beautiful city of Casablanca.
      </p>
      <div class="countdown-container">
        <div class="countdown-header">
          <p>Casablanca Adventure Countdown</p>
        </div>
        <div class="countdown-timer">
          <div class="countdown-unit">
            <div class="countdown-value">{{ days }}</div>
            <div class="countdown-label">Days</div>
          </div>
          <div class="countdown-separator">:</div>
          <div class="countdown-unit">
            <div class="countdown-value">{{ hours }}</div>
            <div class="countdown-label">Hours</div>
          </div>
          <div class="countdown-separator">:</div>
          <div class="countdown-unit">
            <div class="countdown-value">{{ minutes }}</div>
            <div class="countdown-label">Minutes</div>
          </div>
        </div>
        <div class="adventure-image">
          <img src="assets/images/us.jpeg" alt="Adventure awaits - Casablanca" />
        </div>
      </div>
    </div>
  </section>
</div>
