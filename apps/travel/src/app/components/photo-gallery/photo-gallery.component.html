@if (photoUrls.length > 0) {
<div class="photo-gallery">
  <h3 class="gallery-title">Photos</h3>
  <div class="gallery-grid">
    @for (url of photoUrls; track url; let i = $index) {
      <img [src]="url" [alt]="trip.destination" class="gallery-image" (click)="openPhoto(i)" />
    }
  </div>
</div>
}

@if (selectedPhoto()) {
<div class="lightbox-backdrop" (click)="closePhoto()">
  <button class="lightbox-arrow lightbox-arrow--left" (click)="$event.stopPropagation(); prev()" aria-label="Previous">&#8249;</button>
  <img [src]="selectedPhoto()!" [alt]="trip.destination" class="lightbox-image" (click)="$event.stopPropagation()" />
  <button class="lightbox-arrow lightbox-arrow--right" (click)="$event.stopPropagation(); next()" aria-label="Next">&#8250;</button>
</div>
}
