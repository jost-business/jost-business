<nav class="route-actions" aria-label="Trip actions">
  @if (auth.isLoggedIn()) {
    <a class="action primary" routerLink="/trips/new">New trip</a>
    <a class="action" routerLink="/login">{{ auth.user()?.name }}</a>
  } @else if (auth.isResolved()) {
    <a class="action" routerLink="/login">Log in</a>
  }
</nav>
<app-dashboard (tripSelected)="openTrip($event)"></app-dashboard>
