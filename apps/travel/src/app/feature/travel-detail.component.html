<div class="detail-container" *ngIf="trip; else notFound">
  <a routerLink="/" class="back-link">&larr; Back to overview</a>

  <div class="detail-card">
    <h2 class="detail-title">{{ trip.destination }}</h2>

    <div class="detail-grid">
      <div class="detail-item">
        <span class="detail-label">From</span>
        <span class="detail-value">{{ trip.from | date:'dd MMMM yyyy' }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">To</span>
        <span class="detail-value">{{ trip.to | date:'dd MMMM yyyy' }}</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Duration</span>
        <span class="detail-value">{{ duration }} days</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Status</span>
        <span class="detail-value completed">Completed</span>
      </div>
    </div>
  </div>
</div>

<ng-template #notFound>
  <div class="detail-container">
    <a routerLink="/" class="back-link">&larr; Back to overview</a>
    <p class="not-found">Trip not found.</p>
  </div>
</ng-template>
