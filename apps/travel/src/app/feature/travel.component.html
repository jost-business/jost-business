<div class="travel-container">
  <h2 class="travel-title">Travel Dashboard</h2>

  <div class="travel-card" *ngFor="let year of travelYears">
    <div class="card-header">
      <h3 class="card-title">{{ year.year }}</h3>
    </div>
    <div class="card-content">
      <table class="trips-table">
        <thead>
          <tr class="header-row">
            <th class="table-header">Date</th>
            <th class="table-header">Destination</th>
            <th class="table-header">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr class="data-row" *ngFor="let trip of year.trips">
            <td class="table-cell">{{ trip.from | date:'dd.MM' }} - {{ trip.to | date:'dd.MM' }}</td>
            <td class="table-cell">{{ trip.destination }}</td>
            <td class="table-cell status" [class.completed]="getStatus(trip)() === 'Completed'" [class.upcoming]="getStatus(trip)() !== 'Completed'">{{ getStatus(trip)() }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
