<div class="trip-prep-container">
  <h2 class="trip-prep-title">Visa free Countries</h2>

  @for (region of regions; track region.title) {
  <div class="region-card">
    <div class="card-header">
      <h3 class="card-title">{{ region.title }}</h3>
    </div>
    <div class="card-content region-layout">
      <table class="countries-table">
        <thead>
          <tr class="header-row">
            <th class="table-header">Land</th>
          </tr>
        </thead>
        <tbody>
          @for (country of region.countries; track country.name) {
          <tr class="data-row" [class.note]="country.note">
            <td class="table-cell">
              {{ country.name }}
              @if (country.note) {
                <span class="note-text">({{ country.note }})</span>
              }
            </td>
          </tr>
          }
        </tbody>
      </table>
      <div class="map-wrapper" [id]="region.mapId"></div>
    </div>
  </div>
  }

</div>
