<header class="app-toolbar">
  <a class="app-title" href="/about-me/" aria-label="Jost home">
    <span class="brand-mark">J</span>
    <span>Jost</span>
  </a>
  <span class="spacer"></span>
  <div class="nav-pill">
    <nav class="nav-menu">
      <a href="/about-me/" class="nav-link"><span>01</span>Home</a>
      <div class="nav-item dropdown">
        <a href="/travel/" class="nav-link dropdown-toggle"><span>02</span>Travel<i aria-hidden="true"></i></a>
        <div class="dropdown-menu">
          <a href="/travel/dashboard" class="dropdown-link"><span>01</span>Dashboard</a>
          <a href="/travel/gallery" class="dropdown-link"><span>02</span>Gallery</a>
          <a href="/travel/visa-free" class="dropdown-link"><span>03</span>Visa Free</a>
          <a href="/travel/e-visa" class="dropdown-link"><span>04</span>E-Visa</a>
        </div>
      </div>
      @if (auth.isLoggedIn()) {
        <a href="/playground/dashboard" class="nav-link"><span>03</span>Playground</a>
      }
      <!-- Nothing until the session is known, so it does not flash "Login" for a logged-in user -->
      @if (auth.isResolved()) {
        <span class="nav-divider" aria-hidden="true"></span>
        @if (auth.user(); as user) {
          <button type="button" class="nav-link auth-link" (click)="logOut()" [title]="'Logged in as ' + user.name">
            Logout
          </button>
        } @else {
          <a href="/travel/login" class="nav-link auth-link" (click)="logIn($event)">Login</a>
        }
      }
    </nav>
  </div>
</header>
