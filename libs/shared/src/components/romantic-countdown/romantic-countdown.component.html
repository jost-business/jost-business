<lib-countdown [targetDate]="targetDate()" [showSeconds]="showSeconds()">
  <div arrived>
    <ng-content select="[arrived]"></ng-content>
  </div>
</lib-countdown>

<p class="quote">
  &ldquo;Sometimes the best adventures are the ones<br />shared with someone special.&rdquo;
</p>

<div class="photo-frame">
  <img src="assets/images/us.jpeg" alt="Us" />
</div>

@if (version()) {
  <p class="build-version">v{{ version() }}</p>
}
