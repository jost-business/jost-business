@if (trip(); as currentTrip) {
<div class="detail-container">
  <button type="button" class="back-link" (click)="backRequested.emit()">&larr; Back to overview</button>
  <jost-trip-detail-card [trip]="currentTrip"></jost-trip-detail-card>
  <ng-content></ng-content>
  <!-- The gallery is below the fold: its code loads in its own chunk once the
       placeholder scrolls into view, and is prefetched while the browser is idle -->
  @defer (on viewport; prefetch on idle) {
    <jost-photo-gallery [trip]="currentTrip"></jost-photo-gallery>
  } @placeholder {
    <div class="gallery-placeholder" aria-hidden="true"></div>
  } @error {
    <p class="gallery-error">The photos could not be loaded.</p>
  }
</div>
} @else {
<div class="detail-container">
  <button type="button" class="back-link" (click)="backRequested.emit()">&larr; Back to overview</button>
  <p class="not-found">Trip not found.</p>
</div>
}
