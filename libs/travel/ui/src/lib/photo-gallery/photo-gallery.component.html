@if (photoUrls().length > 0) {
<div class="photo-gallery">
  <h3 class="gallery-title">{{ heading() }}</h3>
  <div class="gallery-grid">
    @for (photo of trip().photos; track photo.name; let i = $index) {
      <div class="gallery-tile">
        <button type="button" class="gallery-item" (click)="openPhoto(i)" [attr.aria-label]="'Open photo ' + (i + 1)">
          <img [ngSrc]="photo.url" fill sizes="(max-width: 600px) 100vw, 25vw" [alt]="trip().destination" class="gallery-image" />
        </button>
        @if (deletable()) {
          <button type="button" class="gallery-delete" (click)="deleteRequested.emit(photo)"
                  [attr.aria-label]="'Delete photo ' + (i + 1)" title="Delete photo">&times;</button>
        }
      </div>
    }
  </div>
</div>
}

@if (selectedPhoto(); as photo) {
<div class="lightbox-backdrop" (click)="closePhoto()">
  <button class="lightbox-arrow lightbox-arrow--left" (click)="$event.stopPropagation(); prev()" aria-label="Previous">&#8249;</button>
  <div class="lightbox-frame">
    <img [ngSrc]="photo" fill sizes="80vw" [alt]="trip().destination" class="lightbox-image" (click)="$event.stopPropagation()" />
  </div>
  <button class="lightbox-arrow lightbox-arrow--right" (click)="$event.stopPropagation(); next()" aria-label="Next">&#8250;</button>
</div>
}
