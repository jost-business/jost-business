<div class="detail-card">
  <h2 class="detail-title">{{ trip().destination }}</h2>
  <!-- One quiet line under the name: the photos are what the page is about -->
  <p class="detail-facts">
    <time [attr.datetime]="trip().from.toISOString()">{{ trip().from | date: 'd MMM y' }}</time>
    –
    <time [attr.datetime]="trip().to.toISOString()">{{ trip().to | date: 'd MMM y' }}</time>
    <span class="detail-separator" aria-hidden="true">·</span>
    {{ duration() }} days
  </p>
</div>
